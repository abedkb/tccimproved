<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Make Pack Shift Roster</title>


    <style>

        /* ==================================================
           DIGITAL TCC DUTY ROSTER
        ================================================== */


        /* ==================================================
           COLOUR SYSTEM
        ================================================== */

        :root {

            /* Shift Colours */

            --shift-a: #356b9c;
            --shift-a-dark: #275478;

            --shift-b: #63527f;
            --shift-b-dark: #4d3d68;

            --shift-c: #d5b35e;
            --shift-c-dark: #b89037;

            --shift-d: #4f8a72;
            --shift-d-dark: #3d6f5b;


            /* Board Colours */

            --dark-section: #3d4246;
            --dark-section-2: #30363a;

            --board-bg: linear-gradient(160deg, #eef2fb 0%, #e3e9f7 45%, #dfe6f3 100%);
            --panel-bg: #f8f8f8;

            --border: #777;
            --light-border: #b5b5b5;

            --white: #ffffff;
            --text-dark: #333333;


            /* Status Colours */

            --vacation: #7da3a1;
            --sick-leave: #b98787;
            --family-leave: #9ca8b0;
            --others: #b08c52;
            --permission: #c9793f;

        }


        /* ==================================================
           RESET
        ================================================== */

        * {

            margin: 0;
            padding: 0;

            box-sizing: border-box;

        }


        body {

            font-family:
                Arial,
                Helvetica,
                sans-serif;

            background:
                var(--board-bg);

            color:
                var(--text-dark);

            overflow-x: hidden;

        }


        /* ==================================================
           MAIN HEADER
        ================================================== */

        .board-header {

            background:
                var(--white);

            padding:
                6px 16px;

            display:
                flex;

            justify-content:
                space-between;

            align-items:
                center;

            min-height:
                46px;

        }


        .board-title {

            text-align:
                center;

            flex:
                1;

        }


        .board-title h1 {

            font-size:
                clamp(14px, 1.4vw, 22px);

            font-weight:
                700;

            letter-spacing:
                1px;

            color:
                #2c3550;

        }


        /* ==================================================
           BRAND LOGO (CSS-built "TCC" mark, no image asset)
           Built at its natural 240x172 size, then scaled down
           and clipped to fit the header via a fixed-size wrapper.
        ================================================== */

        .brand-logo-wrap {

            width: 42px;
            height: 30px;
            overflow: hidden;
            flex-shrink: 0;

        }


        .brand-logo-container {

            width: 240px;
            height: 172px;

            background: transparent;

            overflow: hidden;

            transform: scale(0.175);
            transform-origin: top left;

        }


        .brand-logo {

            position: relative;

            width: 100%;
            height: 100%;

            background: transparent;

            overflow: hidden;

        }


        .brand-t-top {

            position: absolute;

            top: 18px;
            left: -35px;

            width: 150px;
            height: 18px;

            background: #008c5a;

            border-radius: 0 9px 9px 0;

        }


        .brand-t-body {

            position: absolute;

            top: 31px;
            left: 20px;

            width: 42px;
            height: 140px;

            background: #008c5a;

            border-radius: 0 0 13px 0;

        }


        .brand-c1 {

            position: absolute;

            top: 8px;
            left: 90px;

            width: 78px;
            height: 130px;

            background: #008c5a;

            border-radius: 28px;

            overflow: hidden;

        }


        .brand-c1::after {

            content: "";

            position: absolute;

            top: 23px;
            right: -15px;

            width: 48px;
            height: 84px;

            background: var(--white);

            border-radius: 0 0 0 18px;

        }


        .brand-c2 {

            position: absolute;

            top: -6px;
            left: 163px;

            width: 95px;
            height: 138px;

            background: #008c5a;

            border-radius: 32px;

            overflow: hidden;

        }


        .brand-c2::after {

            content: "";

            position: absolute;

            top: 30px;
            right: -10px;

            width: 55px;
            height: 88px;

            background: var(--white);

            border-radius: 0 0 0 18px;

        }


        .fullscreen-button {

            background:
                linear-gradient(135deg, #333c4d, #1d2330);

            color:
                white;

            border:
                none;

            padding:
                6px 12px;

            cursor:
                pointer;

            border-radius:
                20px;

            font-size:
                11.5px;

            font-weight:
                600;

            box-shadow:
                0 2px 5px rgba(0,0,0,0.18);

        }


        .fullscreen-button:hover {

            opacity:
                0.85;

        }


        /* ==================================================
           MAIN BOARD
        ================================================== */

        .roster-board {

            display:
                grid;

            grid-template-columns:
                repeat(4, minmax(300px, 1fr));

            width:
                100%;

            min-height:
                calc(100vh - 50px);

            border-bottom:
                2px solid var(--border);

        }


        /* ==================================================
           SHIFT COLUMN
        ================================================== */

        .shift-column {

            background:
                var(--panel-bg);

            border-right:
                2px solid var(--border);

            min-width:
                0;

            position:
                relative;

            container-type:
                inline-size;

        }


        .shift-column:last-child {

            border-right:
                none;

        }


        /* ==================================================
           SHIFT HEADERS
        ================================================== */

        .shift-name {

            height:
                48px;

            display:
                flex;

            align-items:
                center;

            justify-content:
                center;

            position:
                relative;

            color:
                white;

            box-shadow:
                inset 0 -2px 6px rgba(0,0,0,0.12);
        }


        .shift-name-text {

            display:
                flex;

            flex-direction:
                column;

            align-items:
                center;

            line-height:
                1.15;

        }


        .shift-status-line {

            font-size:
                10px;

            font-weight:
                bold;

            letter-spacing:
                1px;

            opacity:
                0.85;

        }


        .shift-name-main {

            font-size:
                clamp(16px, 1.6vw, 24px);

            font-weight:
                600;

            letter-spacing:
                1px;

        }


        .shift-a {

            background:
                linear-gradient(135deg, var(--shift-a), var(--shift-a-dark));

        }


        .shift-b {

            background:
                linear-gradient(135deg, var(--shift-b), var(--shift-b-dark));

        }


        .shift-c {

            background:
                linear-gradient(135deg, var(--shift-c), var(--shift-c-dark));

        }


        .shift-d {

            background:
                linear-gradient(135deg, var(--shift-d), var(--shift-d-dark));

        }


        /* ==================================================
           SECTION HEADERS
        ================================================== */

        .section-header {

            background:
                var(--dark-section);

            color:
                white;

            text-align:
                center;

            font-size:
                clamp(15.5px, 1.3vw, 24px);

            font-weight:
                500;

            padding:
                8px 5px;

            letter-spacing:
                1px;

            border-top:
                1px solid #222;

            border-bottom:
                1px solid #222;

        }


        .sub-section-title {

            background:
                #f4f4f4;

            text-align:
                center;

            padding:
                6px;

            font-size:
                clamp(13px, 1.05vw, 17px);

            font-weight:
                500;

            color:
                #555;

            border-bottom:
                1px solid var(--light-border);

        }


        /* ==================================================
           DUTY BOARD BODY — wraps machines/team/status and spaces
           them across the available height with justify-content:
           space-between (see fitBoardToScreen(), which sets a
           min-height here from the actual space available below
           the header). Text never shrinks to force a fit — if
           content is naturally shorter than the screen, the GAPS
           between sections stretch to fill it; if content is
           naturally taller, min-height simply has no effect and
           the page scrolls (body.board-mode's overflow-y is the
           safety net for that case).
        ================================================== */
        .duty-board-body {

            display:
                flex;

            flex-direction:
                column;

            justify-content:
                space-between;

            gap:
                8px;

        }


        /* ==================================================
           MACHINE AREA — reference boxes only (no staff tied to
           them): 4 across, then MP29/MP30/FM03&amp;FM04 in a row of
           3 below. container-type on .shift-column lets these
           respond to the COLUMN's own width (see @container rules
           further down), so the same markup works full-width in
           rotate mode and narrower when all 4 teams are shown.
        ================================================== */
        .machines-top {

            display:
                grid;

            grid-template-columns:
                repeat(4, 1fr);

            gap:
                clamp(8px, 2vw, 24px);

            margin-bottom:
                clamp(8px, 1.5vw, 16px);

        }


        .machines-second-row {

            display:
                grid;

            grid-template-columns:
                repeat(3, 1fr);

            gap:
                clamp(8px, 2vw, 24px);

            width:
                80%;

            margin:
                0 auto;

        }


        .glossy-section-header {
            background: linear-gradient(135deg, #333c4d, #1d2330);
            color: white;
            text-align: center;
            font-size: clamp(11px, 1vw, 14px);
            font-weight: bold;
            letter-spacing: 1px;
            padding: 5px;
            border-radius: 8px 8px 0 0;
            margin-top: 6px;
        }


        .machine-card, .fm-card {

            text-align:
                center;

        }


        .machine-box, .fm-box {

            border:
                1px solid var(--light-border);

            border-left:
                4px solid var(--machine-accent, var(--border));

            border-radius:
                8px;

            background:
                white;

            overflow:
                hidden;

            box-shadow:
                0 2px 8px rgba(30,40,70,0.10);

        }


        .machine-box-title {

            background:
                white;

            border-bottom:
                1px solid var(--light-border);

            padding:
                4px 8px;

            text-align:
                center;

            font-size:
                clamp(13px, 1.2vw, 18px);

            font-weight:
                600;

            color:
                #2c3550;

        }


        .machine-box-title::before {
            content: "\1F3ED  ";
        }


        /* ==================================================
           TEAM SECTION — a real table: role codes across the top,
           one name per role, then a TL row. Each name cell is
           coloured with that PERSON's home team (not necessarily
           this column's team), so someone on loan is still
           unmistakable even sitting in a row of their own team's
           colour.
        ================================================== */
        .team-section {

            width:
                80%;

            margin:
                0 auto;

        }


        /* ==================================================
           BOARD NAV ARROWS — replace the old dotted rotation
           indicator (and the redundant pair that used to sit inside
           the SHIFT A/B/C/D header). One set only, flanking the
           whole card at its outer edges, vertically centred on
           .shift-column — only shown in rotate mode.
        ================================================== */
        .board-nav-arrow {

            display:
                none;

            position:
                absolute;

            top:
                50%;

            transform:
                translateY(-50%);

            width:
                34px;

            height:
                34px;

            border-radius:
                50%;

            border:
                none;

            background:
                linear-gradient(135deg, #7b68c9, #4a3f96);

            color:
                white;

            font-size:
                18px;

            font-weight:
                bold;

            cursor:
                pointer;

            box-shadow:
                0 3px 8px rgba(30,20,70,0.3);

            z-index:
                2;

        }


        .board-nav-arrow:hover {

            opacity:
                .88;

        }


        .board-nav-arrow.prev { left: 8px; }
        .board-nav-arrow.next { right: 8px; }

        .roster-board.rotate-mode .board-nav-arrow {
            display: flex;
            align-items: center;
            justify-content: center;
        }


        .team-section h2 {

            color:
                white;

            padding:
                7px;

            font-size:
                clamp(13px, 1.1vw, 16px);

            text-align:
                center;

            letter-spacing:
                .5px;

            border-radius:
                8px 8px 0 0;

            box-shadow:
                0 2px 6px rgba(30,40,70,0.12);

        }


        .team-section h2::before {
            content: "\1F465  ";
        }


        .team-table {

            border-radius:
                0 0 8px 8px;

            overflow:
                hidden;

            box-shadow:
                0 3px 10px rgba(30,40,70,0.10);

            width:
                100%;

            border-collapse:
                collapse;

            table-layout:
                fixed;

        }


        .team-table th, .team-table td {

            border:
                1px solid var(--light-border);

            text-align:
                center;

            padding:
                4px;

        }


        .team-table th {

            font-size:
                clamp(13px, 1.1vw, 17px);

            height:
                28px;

            color:
                white;

        }


        .team-table td {

            height:
                clamp(38px, 4.5vw, 50px);

            font-size:
                clamp(12.5px, 1.05vw, 16px);

            font-weight:
                bold;

        }


        .team-name-sub {

            display:
                block;

            font-size:
                0.68em;

            font-weight:
                normal;

            opacity:
                .85;

        }


        .tl-row td {

            height:
                26px;

            background:
                #f5f5f5;

        }


        .tl-row input[type="radio"] {

            width:
                18px;

            height:
                18px;

        }


        /* ==================================================
           LEAVE &amp; STATUS ROW — full-width strip of 5 boxes,
           colours reuse the same --vacation/--sick-leave/
           --family-leave/--others/--permission vars used elsewhere.
        ================================================== */
        .status-section {

            display:
                grid;

            grid-template-columns:
                repeat(5, 1fr);

            gap:
                clamp(10px, 2vw, 25px);

        }


        .status-card {

            text-align:
                center;

        }


        .status-card h3 {

            font-size:
                clamp(11.5px, 0.95vw, 15px);

            font-weight:
                700;

            color:
                white;

            margin-bottom:
                0;

            padding:
                6px 4px;

            border-radius:
                8px 8px 0 0;

            box-shadow:
                0 2px 6px rgba(30,40,70,0.12);

        }


        .status-card.vacation h3 { background: linear-gradient(135deg, #4fc3d9, var(--vacation)); }
        .status-card.sick h3 { background: linear-gradient(135deg, #ef7b8a, var(--sick-leave)); }
        .status-card.family h3 { background: linear-gradient(135deg, #a98fe0, var(--family-leave)); }
        .status-card.permission h3 { background: linear-gradient(135deg, #e0b45a, var(--permission)); }
        .status-card.others h3 { background: linear-gradient(135deg, #8f98a3, var(--others)); }



        .status-box {

            min-height:
                54px;

            border:
                1px solid var(--light-border);

            border-radius:
                0 0 8px 8px;

            background:
                #fafbfd;

            box-shadow:
                0 2px 8px rgba(30,40,70,0.08);

        }


        @container (max-width: 700px) {

            .machines-top { grid-template-columns: repeat(2, 1fr); }
            .machines-second-row { grid-template-columns: 1fr; width: 100%; }
            .team-section { width: 95%; }
            .status-section { grid-template-columns: repeat(2, 1fr); }

        }


        @container (max-width: 420px) {

            .status-section { grid-template-columns: 1fr; }

        }


        /* ==================================================
           STAFF CARD
        ================================================== */

        .staff-card {

            display:
                grid;

            grid-template-columns:
                42px 34px 1fr;

            min-height:
                44px;

            border-bottom:
                1px solid #aaa;

        }


        .staff-card:last-child {

            border-bottom:
                none;

        }


        /* Position */

        .position-code {

            display:
                flex;

            align-items:
                center;

            justify-content:
                center;

            color:
                white;

            font-weight:
                500;

            font-size:
                clamp(13.5px, 1.1vw, 19px);

            border-right:
                1px solid white;

        }


        /* Photo */

        .staff-photo {

            background:
                #d7d7d7;

            border-right:
                1px solid white;

            display:
                flex;

            align-items:
                center;

            justify-content:
                center;

            overflow:
                hidden;

        }


        .staff-photo img {

            width:
                100%;

            height:
                100%;

            object-fit:
                cover;

        }


        /* Placeholder initials */

        .photo-placeholder {

            width:
                32px;

            height:
                32px;

            border-radius:
                50%;

            background:
                rgba(255,255,255,0.5);

            display:
                flex;

            align-items:
                center;

            justify-content:
                center;

            font-size:
                11px;

            color:
                #555;

            font-weight:
                bold;

        }


        /* Staff information */

        .staff-details {

            color:
                white;

            padding:
                3px 7px;

            display:
                flex;

            flex-direction:
                column;

            justify-content:
                center;

            min-width:
                0;

        }


        .staff-name {

            font-size:
                clamp(13px, 1.15vw, 19px);

            font-weight:
                bold;

            white-space:
                nowrap;

            overflow:
                hidden;

            text-overflow:
                ellipsis;

        }


        .staff-role {

            font-size:
                clamp(10.5px, 0.9vw, 14px);

            margin-top:
                2px;

            opacity:
                0.95;

        }


        .staff-phone {

            font-size:
                clamp(9.5px, 0.8vw, 12px);

            margin-top:
                1px;

            opacity:
                0.85;

            white-space:
                nowrap;

            overflow:
                hidden;

            text-overflow:
                ellipsis;

        }


        /* ==================================================
           SHIFT A STAFF COLOUR
        ================================================== */

        .card-a .position-code,
        .card-a .staff-details {

            background:
                var(--shift-a);

        }


        /* ==================================================
           SHIFT B STAFF COLOUR
        ================================================== */

        .card-b .position-code,
        .card-b .staff-details {

            background:
                var(--shift-b);

        }


        /* ==================================================
           SHIFT C STAFF COLOUR
        ================================================== */

        .card-c .position-code,
        .card-c .staff-details {

            background:
                var(--shift-c);

        }


        /* ==================================================
           SHIFT D STAFF COLOUR
        ================================================== */

        .card-d .position-code,
        .card-d .staff-details {

            background:
                var(--shift-d);

        }


        /* ==================================================
           EMPTY STAFF SLOT
        ================================================== */

        .empty-slot {

            display:
                grid;

            grid-template-columns:
                42px 1fr;

            min-height:
                44px;

            border-bottom:
                1px solid #aaa;

        }


        .empty-position {

            display:
                flex;

            align-items:
                center;

            justify-content:
                center;

            color:
                #777;

            background:
                #eeeeee;

            border-right:
                1px solid #aaa;

            font-size:
                14px;

        }


        .empty-space {

            background:
                white;

        }


        .empty-onleave-note {

            font-size:
                10px;

            color:
                #999;

            font-style:
                italic;

            padding:
                2px 4px;

        }


        /* ==================================================
           MECHANICS
        ================================================== */

        .line-pairing {

            margin-bottom:
                0;

        }


        .line-machines {

            display:
                grid;

            grid-template-columns:
                75px 1fr;

            border-bottom:
                1px solid var(--light-border);

        }


        .machine-labels {

            border-right:
                1px solid var(--border);

            background:
                #f3f3f3;

        }


        .machine-label {

            min-height:
                42px;

            display:
                flex;

            align-items:
                center;

            justify-content:
                center;

            border-bottom:
                1px solid var(--light-border);

            font-size:
                clamp(12px, 1vw, 15px);

            color:
                #666;

        }


        .machine-label:last-child {

            border-bottom:
                none;

        }


        .mechanic-staff {

            padding:
                4px;

        }


        /* ==================================================
           SINGLE STAFF ROW
        ================================================== */

        .single-staff-row {

            padding:
                6px;

            background:
                white;

        }


        /* ==================================================
           FILTER MAKERS
        ================================================== */

        .filter-maker {

            padding:
                7px;

            background:
                #f7f7f7;

        }


        /* ==================================================
           ELECTRICIANS
        ================================================== */

        .electrician-area {

            padding:
                7px;

            background:
                #f7f7f7;

        }


        /* ==================================================
           STATUS SECTIONS — grid/card/box rules now live with the
           siliba-style team layout above; .status-content below
           is still used as the padded wrapper inside .status-box.
        ================================================== */

        .status-content {

            padding:
                5px;

        }


        /* ==================================================
           SIMPLE STATUS STAFF CARD
        ================================================== */

        .status-person {

            color:
                white;

            padding:
                6px;

            margin-bottom:
                4px;

            border-radius:
                4px;

            font-size:
                clamp(10.5px, 0.85vw, 13px);

        }


        .status-person.on-loan {
            outline: 2px dashed rgba(255,255,255,0.9);
            outline-offset: -2px;
        }


        .status-person:last-child {

            margin-bottom:
                0;

        }


        .status-person small {

            display:
                block;

            opacity:
                0.8;

            margin-top:
                2px;

        }


        /* ==================================================
           BOTTOM SHIFT LABEL
        ================================================== */

        .bottom-shift-label {

            text-align:
                center;

            color:
                white;

            padding:
                9px;

            margin-top:
                auto;

            font-size:
                clamp(12px, 1vw, 15px);

            letter-spacing:
                1px;

        }


        /* ==================================================
           FOOTER
        ================================================== */

        .board-footer {

            background:
                white;

            border-top:
                1px solid var(--border);

            padding:
                10px;

            text-align:
                center;

            font-size:
                13px;

            letter-spacing:
                1px;

            color:
                #666;

        }


        /* ==================================================
           RESPONSIVE TABLET
        ================================================== */

        @media screen and (max-width: 1300px) {

            .roster-board {

                grid-template-columns:
                    repeat(2, minmax(350px, 1fr));

            }


            .shift-column {

                border-bottom:
                    2px solid var(--border);

            }

        }


        /* ==================================================
           RESPONSIVE MOBILE
        ================================================== */

        @media screen and (max-width: 750px) {

            .board-header {

                flex-direction:
                    column;

                gap:
                    10px;

            }


            .roster-board {

                grid-template-columns:
                    1fr;

            }

        body.board-mode {

        const TCC_TIMEZONE = 'Africa/Dar_es_Salaam'; // EAT, UTC+3 year-round

        function eatDateString(date = new Date()){
            // yyyy-mm-dd in EAT, independent of the viewer's local timezone
            return new Intl.DateTimeFormat('en-CA', {
                timeZone: TCC_TIMEZONE, year: 'numeric', month: '2-digit', day: '2-digit'
            }).format(date);
        }

        function eatTimeString(date = new Date()){
            // HH:MM (24h) in EAT, independent of the viewer's local timezone
            return new Intl.DateTimeFormat('en-GB', {
                timeZone: TCC_TIMEZONE, hour: '2-digit', minute: '2-digit', hour12: false
            }).format(date);
        }

        // Disaster fallback ONLY — used if Supabase is briefly unreachable when
        // reading rotation_config.cycle_start_date. This must stay a FIXED date,
        // never "today": if it moved with the clock, every fresh call during a
        // connection blip would recompute a different (wrong) cycle index for
        // that moment, then silently correct itself once the real read
        // succeeds again — which looks exactly like a team appearing on the
        // wrong day. A fixed constant keeps a transient outage's result at
        // least stable, instead of scrambling day-to-day.
        const ROTATION_FALLBACK_DATE = '2026-01-01';

        function effectiveRotationDateString(){
            // The night shift (19:01-06:59) spans two EAT calendar dates. Before
            // the day shift starts (i.e. it's still the small hours), we're
            // in the tail end of the PREVIOUS calendar day's night shift, so the
            // rotation lookup must still use yesterday's date — otherwise the
            // team on duty would get swapped out the instant the clock crosses
            // midnight, hours before their shift is actually meant to end.
            if (eatTimeString() < CONFIG.DAY_SHIFT_START){
                return eatDateString(new Date(Date.now() - 24 * 60 * 60 * 1000));
            }
            return eatDateString();
        }

        function nextDateString(dateStr){
            // Pure calendar-date arithmetic (no timezone involved) — used to
            // look up tomorrow's rotation slot from a yyyy-mm-dd string.
            const d = new Date(dateStr + 'T00:00:00Z');
            d.setUTCDate(d.getUTCDate() + 1);
            return d.toISOString().slice(0, 10);
        }

        let sb = null;
        if (window.supabase) {
            sb = window.supabase.createClient(CONFIG.SUPABASE_URL, CONFIG.SUPABASE_ANON_KEY);
        } else {
            console.error('Supabase JS failed to load — check your internet connection.');
        }

        /* ============================================================
           SLOT TEMPLATE — 5 whole-shift roles (one MO, PO, MM, PM, ET
           per team — not per-machine/per-line anymore), plus 2 reserve/
           backup slots that feed the "OTHERS" status box. The machines
           and FM03/FM04 are shown as plain reference labels on the
           board (no staff tied to them individually) — see
           MACHINE_LABELS below. This list must stay in sync with the
           assignment_slots seed data in tcc_schema.sql.
           ============================================================ */
        const SLOT_TEMPLATE = [
            // The 5-role "TEAM" table — unchanged, still the only place
            // Team Leader is chosen from (one flag across these 5).
            {id:'mo', section:'roles', label:'Maker Operator', role_code:'MO', sort_order:0},
            {id:'po', section:'roles', label:'Packer Operator', role_code:'PO', sort_order:1},
            {id:'mm', section:'roles', label:'Maker Mechanic', role_code:'MM', sort_order:2},
            {id:'pm', section:'roles', label:'Packer Mechanic', role_code:'PM', sort_order:3},
            {id:'et', section:'roles', label:'Electrician', role_code:'ET', sort_order:4},

            // FM03/FM04 — one person, always MO.
            {id:'fm', section:'fm', machine:'FM03 / FM04', label:'FM03 / FM04', role_code:'MO', sort_order:5},

            // Each machine gets its own MO + PO — separate from (and in
            // addition to) the team-wide roles above.
            {id:'mp22mo', section:'machine', machine:'MP22', label:'MP22', role_code:'MO', sort_order:6},
            {id:'mp22po', section:'machine', machine:'MP22', label:'MP22', role_code:'PO', sort_order:7},
            {id:'mp23mo', section:'machine', machine:'MP23', label:'MP23', role_code:'MO', sort_order:8},
            {id:'mp23po', section:'machine', machine:'MP23', label:'MP23', role_code:'PO', sort_order:9},
            {id:'mp26mo', section:'machine', machine:'MP26', label:'MP26', role_code:'MO', sort_order:10},
            {id:'mp26po', section:'machine', machine:'MP26', label:'MP26', role_code:'PO', sort_order:11},
            {id:'mp28mo', section:'machine', machine:'MP28', label:'MP28', role_code:'MO', sort_order:12},
            {id:'mp28po', section:'machine', machine:'MP28', label:'MP28', role_code:'PO', sort_order:13},
            {id:'mp29mo', section:'machine', machine:'MP29', label:'MP29', role_code:'MO', sort_order:14},
            {id:'mp29po', section:'machine', machine:'MP29', label:'MP29', role_code:'PO', sort_order:15},
            {id:'mp30mo', section:'machine', machine:'MP30', label:'MP30', role_code:'MO', sort_order:16},

        ];

        // Reference list only — which machines get their own MO/PO boxes,
        // in board order (4 across, then the remaining 2 + FM below).
        const MACHINE_LABELS = ['MP22','MP23','MP26','MP28','MP29','MP30'];
        const FM_LABEL = 'FM03 / FM04';

        const SHIFT_LETTERS = ['A','B','C','D'];
        const ROLE_LABELS = { MO:'Maker Operator', PO:'Packer Operator', MM:'Maker Mechanic', PM:'Packer Mechanic', ET:'Electrician' };

        // For a leave replacement: exclude the team paired with the absent
        // person's team today, and whichever team takes over that exact
        // shift window (day/night) next. Given the fixed pairing (A-B,
        // C-D) and fixed block order in our 8-day rotation, this always
        // works out to one specific team, regardless of the date — see
        // the verification run against 3 full cycles before this was
        // added. This is the least-recently/soonest-involved team, so
        // pulling from it doesn't lean on whoever's most conveniently
        // available.
        const REPLACEMENT_SOURCE_TEAM = { A:'D', B:'C', C:'A', D:'B' };

        // Find which slot (if any) a staff member currently occupies,
        // across all 4 teams — needed so a leave replacement can be
        // placed into the EXACT same slot the absent person held.
        async function findStaffCurrentSlot(staffId){
            for (const team of SHIFT_LETTERS){
                const assignments = await DB.getAssignments(team);
                const a = assignments.find(x=>x.staff_id===staffId);
                if (a){
                    const sl = SLOT_TEMPLATE.find(s=>s.id===a.slot_id);
                    return { team, slotId: a.slot_id, roleCode: sl ? sl.role_code : null, label: sl ? sl.label : a.slot_id };
                }
            }
            return null;
        }

        /* ============================================================
           DATA ACCESS LAYER — talks to Supabase directly.
           Read methods never throw: if Supabase is unreachable or not
           configured yet, they log the error, flag `connectionOk = false`,
           and return an empty/safe fallback so the board still renders its
           full structure (all slots, just unassigned) instead of going
           blank. Write methods (add/save/set...) still throw on failure,
           so the admin gets a clear error instead of a silent no-op.
           ============================================================ */
        let connectionOk = true;
        let lastConnectionError = '';

        function withTimeout(promise, ms){
            return Promise.race([
                promise,
                new Promise((_, reject)=> setTimeout(()=> reject(new Error('Request timed out after '+(ms/1000)+'s — check SUPABASE_URL / your internet connection')), ms))
            ]);
        }

        async function safeRead(fn, fallback){
            try {
                const result = await withTimeout(fn(), 8000);
                connectionOk = true;
                return result;
            } catch (e){
                console.error('Supabase read failed:', e);
                connectionOk = false;
                lastConnectionError = (e && e.message) ? e.message : String(e);
                return fallback;
            }
        }

        const DB = {
            async getSlots(){ return SLOT_TEMPLATE; },
            async getStaff(){
                return safeRead(async ()=>{
                    const { data, error } = await sb.from('staff').select('*').order('full_name');
                    if (error) throw error; return data;
                }, []);
            },
            async getAssignments(teamLetter){
                return safeRead(async ()=>{
                    const { data: team } = await sb.from('shift_teams').select('id').eq('letter', teamLetter).single();
                    if (!team) return [];
                    const { data, error } = await sb.from('assignments').select('*, staff(*)').eq('shift_team_id', team.id);
                    if (error) throw error;
                    return data.map(a=>({shift_team:teamLetter, slot_id:a.slot_id, staff_id:a.staff_id, is_team_leader:a.is_team_leader, staff:a.staff}));
                }, []);
            },
            async getRotationStart(){
                return safeRead(async ()=>{
                    const { data, error } = await sb.from('rotation_config').select('cycle_start_date').eq('id',1).single();
                    if (error) throw error; return data.cycle_start_date;
                }, ROTATION_FALLBACK_DATE);
            },
            async saveRotationStart(dateStr){
                const { error } = await sb.from('rotation_config').update({cycle_start_date:dateStr}).eq('id',1);
                if (error) throw error;
            },
            async getLeave(){
                return safeRead(async ()=>{
                    // staff!staff_id disambiguates which of leave_records' two
                    // foreign keys to staff (staff_id vs replacement_staff_id)
                    // this embed should follow — without it, PostgREST can't
                    // tell which one you mean and errors out.
                    const { data, error } = await sb.from('leave_records').select('*, staff!staff_id(full_name)').order('start_date');
                    if (error) throw error; return data;
                }, []);
            },
            async addLeave(rec){
                const { data, error } = await sb.from('leave_records').insert(rec).select().single();
                if (error) throw error;
                return data;
            },
            async updateLeaveStatus(id, status){
                const { error } = await sb.from('leave_records').update({ status }).eq('id', id);
                if (error) throw error;
            },
            // Remembers who was placed to cover this leave, and exactly where
            // (team + slot), so that once the leave ends we know who to remove
            // and who to restore — without this, placing a replacement would
            // overwrite the original person's assignment with no way back.
            async setLeaveReplacement(leaveId, replacementStaffId, team, slotId){
                const { error } = await sb.from('leave_records').update({
                    replacement_staff_id: replacementStaffId,
                    replaced_team: team,
                    replaced_slot_id: slotId,
                }).eq('id', leaveId);
                if (error) throw error;
            },
            async clearLeaveReplacement(leaveId){
                const { error } = await sb.from('leave_records').update({
                    replacement_staff_id: null,
                    replaced_team: null,
                    replaced_slot_id: null,
                }).eq('id', leaveId);
                if (error) throw error;
            },
            async addStaff(rec){
                const { data, error } = await sb.from('staff').insert(rec).select().single();
                if (error) throw error; return data;
            },
            async updateStaffHomeTeam(id, homeTeam){
                const { error } = await sb.from('staff').update({ home_team: homeTeam || null }).eq('id', id);
                if (error) throw error;
            },
            async setAssignment(teamLetter, slotId, staffId, isTeamLeader){
                const { data: team } = await sb.from('shift_teams').select('id').eq('letter', teamLetter).single();
                if (!staffId){
                    await sb.from('assignments').delete().eq('shift_team_id', team.id).eq('slot_id', slotId);
                    return;
                }
                const { error } = await sb.from('assignments').upsert(
                    { shift_team_id: team.id, slot_id: slotId, staff_id: staffId, is_team_leader: !!isTeamLeader },
                    { onConflict: 'shift_team_id,slot_id' }
                );
                if (error) throw error;
                // Only one team leader per shift: marking this slot's person as
                // TL clears the flag on the other 4 role slots for this team.
                if (isTeamLeader){
                    const otherRoleSlotIds = SLOT_TEMPLATE.filter(s=>s.section==='roles' && s.id!==slotId).map(s=>s.id);
                    if (otherRoleSlotIds.length){
                        const { error: clearErr } = await sb.from('assignments')
                            .update({ is_team_leader: false })
                            .eq('shift_team_id', team.id)
                            .in('slot_id', otherRoleSlotIds);
                        if (clearErr) throw clearErr;
                    }
                }
            },
            async uploadPhoto(file){
                if (!file) return null;
                const form = new FormData();
                form.append('file', file);
                form.append('upload_preset', CONFIG.CLOUDINARY_UPLOAD_PRESET);
                const res = await fetch(`https://api.cloudinary.com/v1_1/${CONFIG.CLOUDINARY_CLOUD_NAME}/image/upload`, { method:'POST', body: form });
                const json = await res.json();
                if (!json.secure_url) throw new Error('Upload failed');
                return json.secure_url;
            }
        };

        /* ============================================================
           ROTATION LOGIC — 8-day cycle: each team works 2 consecutive
           days on one shift, 2 days OFF, then 2 consecutive days on the
           OTHER shift, then 2 more days OFF, and repeats. At any point
           exactly one team is DAY, one is NIGHT, and two are OFF.
           ============================================================ */
        function computeTeamStatus(dateStr, cycleStart){
            const d = new Date(dateStr+'T00:00:00');
            const s = new Date(cycleStart+'T00:00:00');
            const diffDays = Math.floor((d - s) / 86400000);
            let cycle = diffDays % 8; if (cycle < 0) cycle += 8;
            const patterns = {
                A: ['DAY','DAY','OFF','OFF','NIGHT','NIGHT','OFF','OFF'],
                B: ['NIGHT','NIGHT','OFF','OFF','DAY','DAY','OFF','OFF'],
                C: ['OFF','OFF','DAY','DAY','OFF','OFF','NIGHT','NIGHT'],
                D: ['OFF','OFF','NIGHT','NIGHT','OFF','OFF','DAY','DAY'],
            };
            const result = {};
            for (const team of SHIFT_LETTERS) result[team] = patterns[team][cycle];
            return result;
        }
        function currentlyActiveWindow(){
            const hhmm = eatTimeString();
            if (hhmm >= CONFIG.DAY_SHIFT_START && hhmm < CONFIG.NIGHT_SHIFT_START) return 'DAY';
            return 'NIGHT';
        }

        /* ============================================================

        async function loadStaffProfile(user){
            const { data } = await sb.from('staff').select('*').eq('auth_user_id', user.id).single();
            session = { user, staff: data || null };
        }


        function afterLogin(navigateToAdmin){
            document.getElementById('loginMsg').innerHTML = '';
            if (!session.staff || !session.staff.is_admin){
                alert('This account does not have leader access. Ask an existing leader to give you leader access if you should have one.');
                Auth.signOut();
                return;
            }
            renderNav();
            // Only an explicit, deliberate sign-in (the login form) jumps to the
            // Admin Panel. Restoring an already-open session on page load (or a

        /* ============================================================
           NAV / VIEW SWITCHING
           ============================================================ */
        function showView(name){
            document.getElementById('rosterBoard').classList.toggle('active', name==='board');
            document.querySelectorAll('.app-view').forEach(v=>v.classList.remove('active'));
            if (name !== 'board') document.getElementById('view-'+name).classList.add('active');
            document.body.classList.toggle('board-mode', name==='board');
            if (name === 'board') fitBoardToScreen();
        }

        /* ============================================================
           FIT-TO-SCREEN — sets a min-height on each column's
           .duty-board-body equal to the space actually available
           below the header, so its justify-content: space-between
           stretches the gaps between the machines/team/status
           sections to fill the screen exactly, at full text size —
           no shrinking. If content is naturally taller than that
           (a very short window), min-height simply has no effect
           and the page scrolls instead (body.board-mode's
           overflow-y is the safety net for that case).
           ============================================================ */
        /* ============================================================
           FIT-TO-SCREEN — first tries to STRETCH: if a column's content
           is naturally shorter than the space available, min-height
           forces .duty-board-body to fill it and justify-content:
           space-between spreads the gaps, at full text size, no
           scrolling. If content is naturally TALLER than the available
           space (a lot of machines/staff to show on a shorter screen),
           stretching can't help — so it falls back to a gentle shrink
           (transform: scale, floored at 0.8 so text stays legible)
           instead of leaving it to scroll, since "no scrolling" is the
           actual goal here.
           ============================================================ */
        function fitBoardToScreen(){
            const board = document.getElementById('rosterBoard');
            if (!board || !board.classList.contains('active')) return;
            const bodies = board.querySelectorAll('.duty-board-body');
            bodies.forEach(b => { b.style.minHeight = '0px'; b.style.transform = 'none'; });
            bodies.forEach(b => {
                // Measure from THIS body's own top (below its column's shift-name
                // header), not the outer board's top — otherwise available height
                // is overestimated by the header's height and min-height overshoots,
                // pushing content down and leaving an unused gap under the header.
                const top = b.getBoundingClientRect().top;
                const available = window.innerHeight - top - 8;
                if (available <= 100) return;
                const natural = b.scrollHeight;
                if (natural <= available){
                    b.style.minHeight = available + 'px';
                } else {
                    const scale = Math.max(available / natural, 0.8);
                    b.style.transformOrigin = 'top center';
                    b.style.transform = `scale(${scale})`;
                }
            });
        }

        let fitResizeTimer = null;
        window.addEventListener('resize', ()=>{
            clearTimeout(fitResizeTimer);
            fitResizeTimer = setTimeout(fitBoardToScreen, 150);
        });

        function renderNav(){
            const nav = document.getElementById('navAuth');

            if (!session.user){
                // General/staff view: only a way for a leader to sign in.

            } else {
