        /* ============================================================
           BOARD RENDERING — generates the exact markup/classes this
           design already uses, driven by SLOT_TEMPLATE + assignments.
           ============================================================ */
        function findStaff(assignment, staffList){
            if (!assignment) return null;
            return staffList.find(s=>s.id===assignment.staff_id) || assignment.staff || null;
        }

        function initials(name){
            return name.split(' ').filter(Boolean).slice(0,2).map(w=>w[0].toUpperCase()).join('');
        }

        // Who's on approved leave covering today — used everywhere a slot is
        // rendered, so someone on leave is never ALSO shown as actively
        // staffing a machine/role, even if a leader hasn't picked a
        // replacement for them yet.
        function onLeaveTodaySet(leaveList){
            const today = eatDateString();
            const ids = new Set();
            (leaveList||[]).forEach(l=>{
                if (l.status !== 'approved') return;
                if (l.start_date > today) return;
                if (l.end_date && l.end_date < today) return;
                ids.add(l.staff_id);
            });
            return ids;
        }

        function staffCardHtml(slot, staff, teamLetter, isTeamLeader, roleLabel, onLeaveIds){
            const isOnLeave = staff && onLeaveIds && onLeaveIds.has(staff.id);
            const photo = staff && staff.photo_url
                ? `<img src="${staff.photo_url}" alt="">`
                : `<div class="photo-placeholder">${staff ? initials(staff.full_name) : slot.role_code}</div>`;
            if (!staff || isOnLeave){
                const note = isOnLeave ? `<div class="empty-onleave-note">${staff.full_name} &mdash; on leave</div>` : '';
                return `<div class="empty-slot">
                    <div class="empty-position">${slot.role_code}</div>
                    <div class="empty-space">${note}</div>
                  </div>`;
            }
            // If this person's home team differs from the team they're
            // currently placed in, colour the card with their HOME team's
            // colour (not this column's colour) and tag it, so a leader
            // switching someone in to help is unmistakable, not mistaken
            // for a data error.
            const onLoan = staff.home_team && staff.home_team !== teamLetter;
            const colourTeam = onLoan ? staff.home_team : teamLetter;
            const cardClass = 'card-' + colourTeam.toLowerCase() + (onLoan ? ' on-loan' : '');
            const loanTag = onLoan ? ` <span class="loan-tag">TEAM ${staff.home_team}</span>` : '';
            return `<div class="staff-card ${cardClass}">
                <div class="position-code">${slot.role_code}</div>
                <div class="staff-photo">${photo}</div>
                <div class="staff-details">
                    <span class="staff-name">${staff.full_name}${isTeamLeader?' (TL)':''}${loanTag}</span>
                    <span class="staff-role">${roleLabel || staff.job_title || ''}</span>
                    ${staff.phone ? `<span class="staff-phone">${staff.phone}</span>` : ''}
                </div>
            </div>`;
        }

        function leaveContentHtml(leaveList, staffList, type, teamLetter){
            const today = eatDateString();
            const entries = leaveList.filter(l=>{
                if (l.leave_type !== type) return false;
                if (l.status && l.status !== 'approved') return false;
                if (l.start_date > today) return false;
                if (l.end_date && l.end_date < today) return false;
                const staff = staffList.find(s=>s.id===l.staff_id);
                // Show on the person's actual home team — NOT whether they
                // currently hold a live slot there. Being replaced (the whole
                // point of approving their leave) removes them from the slot,
                // so checking slot membership made the entry vanish the moment
                // a replacement was placed.
                if (!staff || staff.home_team !== teamLetter) return false;
                return true;
            }).map(l=>{
                const staff = staffList.find(s=>s.id===l.staff_id) || l.staff;
                if (!staff) return '';
                const colourTeam = staff.home_team || teamLetter;
                return `<div class="status-person shift-${colourTeam.toLowerCase()}">${staff.full_name}<small>${staff.job_title||''}</small></div>`;
            }).join('');
            return entries;
        }

        function reserveStaffHtml(teamLetter, assignments, staffList, onLeaveIds){
            const reserveSlots = SLOT_TEMPLATE.filter(s=>s.section==='others');
            const entries = reserveSlots.map(sl=>{
                const a = assignments.find(x=>x.slot_id===sl.id);
                const staff = findStaff(a, staffList);
                if (!staff || (onLeaveIds && onLeaveIds.has(staff.id))) return '';
                const onLoan = staff.home_team && staff.home_team !== teamLetter;
                const colourTeam = onLoan ? staff.home_team : teamLetter;
                const loanTag = onLoan ? ` <span class="loan-tag" style="border-color:white;">TEAM ${staff.home_team}</span>` : '';
                return `<div class="status-person shift-${colourTeam.toLowerCase()}${onLoan?' on-loan':''}">${staff.full_name}${loanTag}<small>${staff.job_title||''}</small></div>`;
            }).join('');
            return entries;
        }

        // One machine (or FM) box: shows its MO row, and its PO row if it
        // has one (FM only has MO). Each name is coloured by that
        // PERSON's home team — same on-loan logic as the team table.
        // One machine (or FM) box's staff rows, using the same rich
        // photo-card look as the rest of the app (avatar, name, role,
        // phone) rather than a bare line of text.
        function machineBoxSlotsHtml(codes, slotSection, machineName, slots, assignments, staffList, teamLetter, onLeaveIds){
            return codes.map(code=>{
                const sl = slots.find(s=>s.section===slotSection && s.machine===machineName && s.role_code===code);
                const a = assignments.find(x=>x.slot_id===sl.id);
                const staff = findStaff(a, staffList);
                return staffCardHtml(sl, staff, teamLetter, false, ROLE_LABELS[code], onLeaveIds);
            }).join('');
        }

        function shiftColumnHtml(teamLetter, statusWord, isActiveNow, isNextUp, nextUpWord, slots, staffList, assignments, leaveList){
            const onLeaveIds = onLeaveTodaySet(leaveList);
            // Machines + FM each show their own MO (and PO, except FM)
            // right on the board now, in the same photo-card style used
            // elsewhere — a bordered card with a colour-accented left
            // edge, a title bar (+ decorative "Online" badge), and full
            // staff rows (avatar, name, role, phone) beneath it.
            const MACHINE_ACCENTS = ['#3aa65a','#3b82c9','#8b5fc9','#e08a2e','#1fa8a0','#d64550'];
            const machineCardHtml = (m, i) => `<div class="machine-card">
                <div class="machine-box" style="--machine-accent:${MACHINE_ACCENTS[i % MACHINE_ACCENTS.length]};">
                    <div class="machine-box-title">${m}</div>
                    ${machineBoxSlotsHtml(['MO','PO'], 'machine', m, slots, assignments, staffList, teamLetter, onLeaveIds)}
                </div>
            </div>`;
            const machinesTopHtml = MACHINE_LABELS.slice(0,4).map(machineCardHtml).join('');
            const machinesSecondRowHtml = MACHINE_LABELS.slice(4).map((m,i)=>machineCardHtml(m,i+4)).join('')
                + `<div class="fm-card">
                    <div class="machine-box" style="--machine-accent:#5b6470;">
                        <div class="machine-box-title">${FM_LABEL}</div>
                        ${machineBoxSlotsHtml(['MO'], 'fm', FM_LABEL, slots, assignments, staffList, teamLetter, onLeaveIds)}
                    </div>
                </div>`;

            // The whole team is just 5 roles now — one MO, PO, MM, PM, ET —
            // shown as a real table: role codes across the top (fixed
            // colours per ROLE, matching the reference design), one name
            // cell per role below (coloured by that PERSON's home team, so
            // an on-loan helper still reads correctly), then a TL row.
            const ROLE_ORDER = ['MO','PO','MM','PM','ET'];
            const ROLE_HEADER_STYLE = {
                MO: {bg:'linear-gradient(135deg,#4f8fd1,#2f66a8)', icon:'\u{1F477}'},
                PO: {bg:'linear-gradient(135deg,#5cb87a,#358a55)', icon:'\u{1F527}'},
                MM: {bg:'linear-gradient(135deg,#9b7fd4,#6f4fae)', icon:'\u2699\uFE0F'},
                PM: {bg:'linear-gradient(135deg,#eb9d4e,#cc7a20)', icon:'\u{1F4CB}'},
                ET: {bg:'linear-gradient(135deg,#3fb6ae,#1d8a83)', icon:'\u26A1'},
            };
            const roleAssignments = ROLE_ORDER.map(code=>{
                const sl = slots.find(s=>s.role_code===code && s.section==='roles');
                const a = assignments.find(x=>x.slot_id===sl.id);
                const staff = findStaff(a, staffList);
                return { code, sl, a, staff, onLeave: staff && onLeaveIds.has(staff.id) };
            });

            const headerRowHtml = roleAssignments.map(r =>
                `<th style="background:${ROLE_HEADER_STYLE[r.code].bg};">${ROLE_HEADER_STYLE[r.code].icon} ${r.code}</th>`).join('');

            const nameRowHtml = roleAssignments.map(r=>{
                if (!r.staff || r.onLeave){
                    const note = r.onLeave ? `<span class="team-name-sub">${r.staff.full_name} on leave</span>` : '';
                    return `<td style="color:#999;font-weight:normal;">&mdash;${note}</td>`;
                }
                const onLoan = r.staff.home_team && r.staff.home_team !== teamLetter;
                const colourTeam = onLoan ? r.staff.home_team : teamLetter;
                const loanTag = onLoan ? `<span class="loan-tag" style="border-color:white;">TEAM ${r.staff.home_team}</span>` : '';
                return `<td class="shift-${colourTeam.toLowerCase()}${onLoan?' on-loan':''}" style="color:white;">
                    ${r.staff.full_name}${loanTag}
                    <span class="team-name-sub">${ROLE_LABELS[r.code] || ''}${r.staff.phone ? ' &middot; '+r.staff.phone : ''}</span>
                </td>`;
            }).join('');

            const tlRowHtml = roleAssignments.map(r =>
                `<td><input type="radio" disabled ${r.a && r.a.is_team_leader && !r.onLeave ? 'checked' : ''}></td>`).join('');

            const teamHeading = `TEAM LEADER (TL)`;

            const vac = leaveContentHtml(leaveList, staffList, 'vacation', teamLetter);
            const sick = leaveContentHtml(leaveList, staffList, 'sick', teamLetter);
            const fam = leaveContentHtml(leaveList, staffList, 'family', teamLetter);
            const perm = leaveContentHtml(leaveList, staffList, 'permission', teamLetter);
            const others = reserveStaffHtml(teamLetter, assignments, staffList, onLeaveIds);

            // STANDBY belongs to whoever is genuinely about to come on duty next
            // (tomorrow's morning team while it's night, or today's night team
            // while it's morning) — not to whichever team happened to work
            // earlier today and has simply already finished.
            const barLabel = isActiveNow
                ? `${statusWord} &mdash; ON DUTY`
                : isNextUp
                    ? `${nextUpWord} &mdash; STANDBY`
                    : (statusWord === 'OFF' ? 'OFF' : statusWord);

            return `<section class="shift-column ${isActiveNow?'active-now':''}">

                <div class="shift-name shift-${teamLetter.toLowerCase()}">
                    <div class="shift-name-text">
                        <span class="shift-status-line ${isActiveNow?'is-now':''}">${barLabel}</span>
                        <span class="shift-name-main">SHIFT ${teamLetter}</span>
                    </div>
                </div>

                <button class="board-nav-arrow prev" onclick="jumpToRotation((rotationIndex+3)%4)" title="Previous shift">&#8249;</button>
                <button class="board-nav-arrow next" onclick="jumpToRotation((rotationIndex+1)%4)" title="Next shift">&#8250;</button>

                <div class="duty-board-body">
                    <section class="machines-section">
                        <div class="glossy-section-header">&#9881;&#65039; MACHINES</div>
                        <div class="machines-top">${machinesTopHtml}</div>
                        <div class="machines-second-row">${machinesSecondRowHtml}</div>
                    </section>

                    <section class="team-section">
                        <h2 class="shift-${teamLetter.toLowerCase()}">${teamHeading}</h2>
                        <table class="team-table">
                            <tr>${headerRowHtml}</tr>
                            <tr>${nameRowHtml}</tr>
                            <tr class="tl-row">${tlRowHtml}</tr>
                        </table>
                    </section>

                    <section class="status-section">
                        <div class="status-card vacation">
                            <h3>&#127796; VACATION</h3>
                            <div class="status-box"><div class="status-content">${vac || ''}</div></div>
                        </div>
                        <div class="status-card sick">
                            <h3>&#10133; SICK LEAVE</h3>
                            <div class="status-box"><div class="status-content">${sick || ''}</div></div>
                        </div>
                        <div class="status-card family">
                            <h3>&#128106; FAMILY LEAVE</h3>
                            <div class="status-box"><div class="status-content">${fam || ''}</div></div>
                        </div>
                        <div class="status-card others">
                            <h3>&#8943; OTHERS</h3>
                            <div class="status-box"><div class="status-content">${others || ''}</div></div>
                        </div>
                        <div class="status-card permission">
                            <h3>&#128196; PERMISSION</h3>
                            <div class="status-box"><div class="status-content">${perm || ''}</div></div>
                        </div>
                    </section>
                </div>

            </section>`;
        }

        /* ============================================================
           ROTATING KIOSK VIEW — spotlights one shift column at a time
           (A -> B -> C -> D -> A ...), 3 minutes each, instead of showing
           all four at once. Persisted per-device via localStorage so a
           fixed kiosk display keeps whatever mode it was left in.
           ============================================================ */
        const ROTATION_INTERVAL_MS = 3 * 60 * 1000;
        let rotationEnabled = (localStorage.getItem('tcc_rotation_enabled') ?? 'true') === 'true';
        let rotationIndex = 0;
        let rotationTimer = null;

        function applyRotationVisibility(){
            const board = document.getElementById('rosterBoard');
            board.classList.toggle('rotate-mode', rotationEnabled);
            board.querySelectorAll('.shift-column').forEach((col, i)=>{
                col.classList.toggle('rotate-active', !rotationEnabled || i === rotationIndex);
            });
            updateRotateBtnLabel();
            fitBoardToScreen();
        }

        function updateRotateBtnLabel(){
            const btn = document.getElementById('rotateToggleBtn');
            if (!btn) return;
            btn.innerHTML = rotationEnabled ? `&#128260; Rotating: Shift ${SHIFT_LETTERS[rotationIndex]}` : '&#128203; Show All Shifts';
        }

        function startRotationTimer(){
            stopRotationTimer();
            rotationTimer = setInterval(()=>{
                rotationIndex = (rotationIndex + 1) % SHIFT_LETTERS.length;
                applyRotationVisibility();
            }, ROTATION_INTERVAL_MS);
        }

        function stopRotationTimer(){
            if (rotationTimer) clearInterval(rotationTimer);
            rotationTimer = null;
        }

        function jumpToRotation(i){
            rotationIndex = i;
            applyRotationVisibility();
            if (rotationEnabled) startRotationTimer(); // reset the clock so it doesn't jump again a moment later
        }

        function toggleRotationMode(){
            rotationEnabled = !rotationEnabled;
            localStorage.setItem('tcc_rotation_enabled', String(rotationEnabled));
            if (rotationEnabled) startRotationTimer(); else stopRotationTimer();
            applyRotationVisibility();
        }

        // Auto-restores anyone who was swapped out to cover a leave, once
        // that leave has actually ended (date passed, or revoked) — removes
        // the covering replacement and puts the original person back in
        // their exact slot. Runs at the start of every board render; on an
        // anonymous viewer's browser the write is silently rejected by RLS
        // (view-only), so this only actually takes effect once a logged-in
        // leader's browser renders the board — which is the only place
        // capable of writing anyway.
        async function reconcileExpiredReplacements(){
            const leaveList = await DB.getLeave();
            const today = eatDateString();
            const covering = leaveList.filter(l => l.replacement_staff_id);
            for (const l of covering){
                const expired = l.status !== 'approved' || (l.end_date && l.end_date < today);
                if (!expired) continue;
                if (l.replaced_team && l.replaced_slot_id){
                    // Restore unless a leader has deliberately put a THIRD,
                    // different person in that slot since — an empty slot (the
                    // replacement already having been removed some other way)
                    // still gets the original person restored; it's only
                    // skipped when someone else entirely is now there.
                    const current = await DB.getAssignments(l.replaced_team);
                    const a = current.find(x=>x.slot_id === l.replaced_slot_id);
                    if (!a || a.staff_id === l.replacement_staff_id){
                        await DB.setAssignment(l.replaced_team, l.replaced_slot_id, l.staff_id, false);
                    }
                }
                await DB.clearLeaveReplacement(l.id);
            }
        }

        async function renderBoard(){
            try {
                const today = effectiveRotationDateString();
                const slots = await DB.getSlots();

                // Best-effort — restores anyone whose covering leave has just
                // ended, before fetching everything else, so this same render
                // shows the correction immediately rather than waiting for the
                // next refresh. Never blocks the render if it fails (e.g. an
                // anonymous viewer with no write access).
                try { await reconcileExpiredReplacements(); } catch (e){ /* view-only session, or nothing to reconcile */ }

                // Fetch everything up front, with each call individually
                // fault-tolerant (safeRead + timeout). None of these throw.
                // Run them all in parallel (not one-by-one) so a slow/unhealthy
                // Supabase project costs one ~8s timeout total, not up to 8 of
                // them stacked in series.
                const [cycleStart, staffList, leaveList, assignmentsList] = await Promise.all([
                    DB.getRotationStart(),
                    DB.getStaff(),
                    DB.getLeave(),
                    Promise.all(SHIFT_LETTERS.map(team => DB.getAssignments(team)))
                ]);
                const assignmentsByTeam = {};
                SHIFT_LETTERS.forEach((team, i) => { assignmentsByTeam[team] = assignmentsList[i]; });

                const statuses = computeTeamStatus(today, cycleStart);
                const activeWindow = currentlyActiveWindow();
                // Only needed to find "who's genuinely next" while it's night —
                // that's tomorrow's day-shift team, not today's (already-finished)
                // day-shift team.
                const nextDayStatuses = activeWindow === 'NIGHT'
                    ? computeTeamStatus(nextDateString(today), cycleStart)
                    : null;

                // From here on everything is a pure, synchronous string-building
                // step over plain data already in hand — it cannot hang or throw
                // due to network/Supabase issues.
                let html = '';
                for (const team of SHIFT_LETTERS){
                    const statusWord = statuses[team];
                    const isActiveNow = statusWord === activeWindow;
                    let isNextUp = false;
                    let nextUpWord = null;
                    if (!isActiveNow){
                        if (activeWindow === 'DAY' && statusWord === 'NIGHT'){
                            isNextUp = true; nextUpWord = 'NIGHT';
                        } else if (activeWindow === 'NIGHT' && nextDayStatuses[team] === 'DAY'){
                            isNextUp = true; nextUpWord = 'DAY';
                        }
                    }
                    html += shiftColumnHtml(team, statusWord, isActiveNow, isNextUp, nextUpWord, slots, staffList,
                        assignmentsByTeam[team], leaveList);
                }
                document.getElementById('rosterBoard').innerHTML = html;
            } catch (e){
                // Last-resort safety net: something unexpected broke the render
                // (a bug, not just "Supabase unreachable" — those are already
                // handled above). Still show the full empty skeleton rather than
                // a blank page, and surface the real error.
                console.error('renderBoard failed unexpectedly:', e);
                connectionOk = false;
                lastConnectionError = (e && e.message) ? e.message : String(e);
                try {
                    const slots = SLOT_TEMPLATE;
                    let html = '';
                    for (const team of SHIFT_LETTERS){
                        html += shiftColumnHtml(team, 'OFF', false, false, null, slots, [], [], []);
                    }
                    document.getElementById('rosterBoard').innerHTML = html;
                } catch (e2){
                    console.error('Fallback skeleton render also failed:', e2);
                }
            }
            renderConnStatus();
            applyRotationVisibility();
        }

        function renderConnStatus(){
            const el = document.getElementById('connStatus');
            if (connectionOk){ el.style.display = 'none'; return; }
            el.style.display = 'block';
            el.textContent = 'Not connected to Supabase — the board below is showing its layout with no names yet. '
                + 'Check SUPABASE_URL / SUPABASE_ANON_KEY in the CONFIG section of this file, and that tcc_schema.sql has been run.'
                + (lastConnectionError ? ' (' + lastConnectionError + ')' : '');
        }

        function tickClock() {
            const time = new Intl.DateTimeFormat('en-GB', {
                timeZone: TCC_TIMEZONE, hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: false
            }).format(new Date());
            document.getElementById('liveClock').textContent = time;
        }

        function toggleFullscreen() {
            if (!document.fullscreenElement) document.documentElement.requestFullscreen();
            else document.exitFullscreen();
        }

        /* ============================================================
           ADMIN PANEL (leaders only — regular staff have no accounts
           and only ever see the public duty board)
           ============================================================ */
        const AdminView = {
            activeTeamTab: 'A',
            async init(){
                this.renderTeamTabs();
                await this.renderAssignments('A');
                await this.renderStaffDirectory();
                await this.renderLeaveAdmin();
                document.getElementById('cycleStartInput').value = await DB.getRotationStart();
                this.refreshNewStaffMachineField();
                await this.renderStatCards();
            },
            async renderStatCards(){
                const staffList = await DB.getStaff();
                const leaveList = await DB.getLeave();
                const today = eatDateString();
                const pendingCount = leaveList.filter(l => l.status === 'pending').length;
                const onLeaveToday = leaveList.filter(l =>
                    l.status === 'approved' && l.start_date <= today && (!l.end_date || l.end_date >= today)
                ).length;
                const cards = [
                    { label: 'Total Staff', value: staffList.length, icon: '&#128101;', accent: '#4f8fd1' },
                    { label: 'Teams', value: SHIFT_LETTERS.length, icon: '&#127981;', accent: '#63527f' },
                    { label: 'Pending Leave', value: pendingCount, icon: '&#9203;', accent: '#d5b35e' },
                    { label: 'On Leave Today', value: onLeaveToday, icon: '&#127796;', accent: '#4f8a72' },
                ];
                document.getElementById('adminStatCards').innerHTML = cards.map(c =>
                    `<div class="admin-stat-card" style="--stat-accent:${c.accent};">
                        <div class="stat-label">${c.icon} ${c.label}</div>
                        <div class="stat-value">${c.value}</div>
                    </div>`).join('');
            },
            switchTab(tab){
                document.querySelectorAll('.admin-sidebar .tab-btn').forEach(b=>b.classList.remove('active'));
                document.querySelector(`.tab-btn[data-atab="${tab}"]`).classList.add('active');
                document.querySelectorAll('.admin-tab-panel').forEach(el=>el.classList.remove('active'));
                document.getElementById('admin-'+tab).classList.add('active');
            },
            renderTeamTabs(){
                const el = document.getElementById('adminTeamTabs');
                el.innerHTML = SHIFT_LETTERS.map(t=>
                    `<button class="${t===this.activeTeamTab?'active':''}" onclick="AdminView.renderAssignments('${t}')">Shift ${t}</button>`).join('');
            },
            async renderAssignments(team){
                this.activeTeamTab = team;
                this.renderTeamTabs();
                // Machine slots (MP22/23/26/28/29/30, MO+PO each) are no longer
                // listed here — they're set from the Staff Directory tab instead,
                // right on each MO/PO's own row, which is much faster than
                // hunting through 12 extra rows here for the common case of
                // "assign this person to their usual machine".
                const slots = (await DB.getSlots()).filter(s => s.section !== 'machine');
                const staffList = await DB.getStaff();
                const assignments = await DB.getAssignments(team);
                // Each slot's dropdown only offers staff whose OWN role
                // matches that slot's role code — an MO row only lists
                // MO's, a PO row only PO's, etc. "OTHER" (reserve/backup)
                // slots still take anyone, since backup isn't tied to one
                // skill. If someone already assigned here has a different
                // role than the slot expects (old data), they're still
                // included and flagged, so nothing gets silently hidden.
                const optionsForSlot = (sl, currentStaffId) => {
                    const matches = sl.role_code === 'OTHER'
                        ? staffList
                        : staffList.filter(s => s.role_code === sl.role_code || s.id === currentStaffId);
                    return matches.map(s=>{
                        const tag = s.home_team ? ` (Team ${s.home_team}${s.home_team===team?' — home':''})` : '';
                        const mismatch = sl.role_code !== 'OTHER' && s.role_code !== sl.role_code ? ' — role mismatch' : '';
                        return `<option value="${s.id}">${s.full_name}${tag}${mismatch}</option>`;
                    }).join('');
                };
                const rows = slots.map(sl=>{
                    const a = assignments.find(x=>x.slot_id===sl.id);
                    const staff = findStaff(a, staffList);
                    const onLoan = staff && staff.home_team && staff.home_team !== team;
                    const showTL = sl.section==='roles';
                    const options = optionsForSlot(sl, a ? a.staff_id : null);
                    return `<tr${onLoan ? ' style="background:#fff8e6;"' : ''}>
                        <td>${sl.label}${onLoan ? ` <span class="loan-tag" style="border-color:#b08c52;color:#8a6a2f;">ON LOAN &mdash; TEAM ${staff.home_team}</span>` : ''}</td><td>${sl.role_code}</td>
                        <td><select id="assign_${sl.id}"><option value="">&mdash; Unassigned &mdash;</option>${options}</select></td>
                        <td>${showTL ? `<input type="checkbox" id="tl_${sl.id}" ${a&&a.is_team_leader?'checked':''}>` : ''}</td>
                        <td><button class="app-btn" style="padding:6px 12px;font-size:12.5px;" onclick="AdminView.saveSlot('${team}','${sl.id}')">Save</button></td>
                    </tr>`;
                }).join('');
                document.getElementById('adminAssignBody').innerHTML = `<table class="app-table">
                    <thead><tr><th>Role</th><th>Code</th><th>Assign staff</th><th>Team Leader</th><th></th></tr></thead>
                    <tbody>${rows}</tbody></table>`;
                assignments.forEach(a=>{
                    const sel = document.getElementById('assign_'+a.slot_id);
                    if (sel) sel.value = a.staff_id;
                });
            },
            async saveSlot(team, slotId){
                const staffId = document.getElementById('assign_'+slotId).value || null;
                const tlEl = document.getElementById('tl_'+slotId);
                const isTL = tlEl ? tlEl.checked : false;
                try {
                    await DB.setAssignment(team, slotId, staffId, isTL);
                    await this.renderAssignments(team);
                    await renderBoard();
                } catch (e){
                    alert('Could not save: ' + (e.message || e));
                }
            },
            async renderStaffDirectory(){
                this.lastStaffList = await DB.getStaff();
                // Build a staffId -> current machine lookup by checking every
                // team's machine-section assignments (a person's machine is
                // tied to whichever team they're actually placed in for that
                // slot — normally their own home_team).
                const slots = await DB.getSlots();
                const machineSlots = slots.filter(s => s.section === 'machine');
                const allAssignments = await Promise.all(SHIFT_LETTERS.map(t => DB.getAssignments(t)));
                this.lastMachineMap = {};
                allAssignments.forEach((teamAssignments, i)=>{
                    const team = SHIFT_LETTERS[i];
                    teamAssignments.forEach(a=>{
                        const sl = machineSlots.find(s=>s.id===a.slot_id);
                        if (sl) this.lastMachineMap[a.staff_id] = { team, machine: sl.machine, slotId: sl.id };
                    });
                });
                this.renderStaffDirectoryRows();
                if (document.getElementById('adminStatCards')) await this.renderStatCards();
            },
            renderStaffDirectoryRows(){
                const staffList = this.lastStaffList || [];
                const machineMap = this.lastMachineMap || {};
                const q = (document.getElementById('staffSearch')?.value || '').trim().toLowerCase();
                const roleFilter = document.getElementById('staffRoleFilter')?.value || '';
                let filtered = q ? staffList.filter(s => (s.full_name||'').toLowerCase().includes(q)) : staffList.slice();
                if (roleFilter) filtered = filtered.filter(s => s.role_code === roleFilter);
                // Group by role so, e.g., picking "MO" (or just scanning the
                // unfiltered list) shows all the MO's together, each with their
                // own machine picker — instead of that living as 12 separate
                // rows over in Assignments.
                filtered.sort((a,b)=> (a.role_code||'').localeCompare(b.role_code||'') || (a.full_name||'').localeCompare(b.full_name||''));
                const homeTeamSelect = s => `<select onchange="AdminView.updateHomeTeam('${s.id}', this.value)" style="font-size:12.5px;padding:2px 4px;">
                    <option value="" ${!s.home_team?'selected':''}>&mdash;</option>
                    ${SHIFT_LETTERS.map(t=>`<option value="${t}" ${s.home_team===t?'selected':''}>Shift ${t}</option>`).join('')}
                </select>`;
                const machineCell = s => {
                    if (s.role_code !== 'MO' && s.role_code !== 'PO') return '&mdash;';
                    if (!s.home_team) return `<span style="color:#999;font-size:12px;">set home team first</span>`;
                    const current = machineMap[s.id];
                    const options = MACHINE_LABELS.map(m=>
                        `<option value="${m}" ${current && current.machine===m ? 'selected' : ''}>${m}</option>`).join('');
                    return `<select onchange="AdminView.updateStaffMachine('${s.id}', this.value)" style="font-size:12.5px;padding:2px 4px;">
                        <option value="" ${!current?'selected':''}>&mdash; none &mdash;</option>
                        ${options}
                    </select>`;
                };
                const rows = filtered.map(s=>`<tr>
                    <td>${s.full_name}</td><td>${s.email||''}</td><td>${s.job_title||''}</td><td>${s.role_code||''}</td><td>${homeTeamSelect(s)}</td><td>${machineCell(s)}</td><td>${s.is_admin?'Yes':''}</td>
                </tr>`).join('');
                document.getElementById('staffDirectory').innerHTML = `<h3 style="margin-bottom:10px;">&#128101; All staff (${filtered.length}${q ? ` matching &ldquo;${q}&rdquo;` : ''})</h3>
                    <table class="app-table"><thead><tr><th>Name</th><th>Email</th><th>Title</th><th>Role</th><th>Home team</th><th>Machine</th><th>Leader?</th></tr></thead>
                    <tbody>${rows}</tbody></table>`;
            },
            async updateStaffMachine(staffId, newMachine){
                const staffList = this.lastStaffList || [];
                const s = staffList.find(x=>x.id===staffId);
                if (!s) return;
                if (!s.home_team){
                    alert('Set a home team for this person first.');
                    await this.renderStaffDirectory();
                    return;
                }
                const current = (this.lastMachineMap || {})[staffId];
                const roleCode = s.role_code === 'PO' ? 'po' : 'mo';
                try {
                    // Clear their previous machine slot first (if any) so they
                    // don't end up double-booked across two machines.
                    if (current){
                        await DB.setAssignment(current.team, current.slotId, null, false);
                    }
                    if (newMachine){
                        const newSlotId = newMachine.toLowerCase() + roleCode;
                        await DB.setAssignment(s.home_team, newSlotId, staffId, false);
                    }
                    await this.renderStaffDirectory();
                    await renderBoard();
                } catch (e){
                    alert('Could not update machine: ' + (e.message || e));
                    await this.renderStaffDirectory();
                }
            },
            async updateHomeTeam(staffId, homeTeam){
                try {
                    await DB.updateStaffHomeTeam(staffId, homeTeam);
                    if (this.lastStaffList){
                        const s = this.lastStaffList.find(x=>x.id===staffId);
                        if (s) s.home_team = homeTeam || null;
                    }
                    await this.renderAssignments(this.activeTeamTab);
                    await renderBoard();
                } catch (e){
                    alert('Could not update home team: ' + (e.message || e));
                }
            },
            refreshNewStaffMachineField(){
                const role = document.getElementById('newStaffRole').value;
                const machineField = document.getElementById('newStaffMachine');
                const applicable = (role === 'MO' || role === 'PO');
                machineField.disabled = !applicable;
                if (!applicable) machineField.value = '';
            },
            async addStaff(){
                const msg = document.getElementById('addStaffMsg');
                const name = document.getElementById('newStaffName').value.trim();
                const email = document.getElementById('newStaffEmail').value.trim();
                if (!name){ msg.innerHTML = '<div class="app-msg error">Name is required.</div>'; return; }
                const file = document.getElementById('newStaffPhoto').files[0];
                let photo_url = null;
                try { photo_url = await DB.uploadPhoto(file); } catch(e){ msg.innerHTML = `<div class="app-msg error">Photo upload failed: ${e.message}</div>`; return; }
                const rec = {
                    full_name: name, email, job_title: document.getElementById('newStaffTitle').value,
                    role_code: document.getElementById('newStaffRole').value,
                    home_team: document.getElementById('newStaffHomeTeam').value || null,
                    phone: document.getElementById('newStaffPhone').value,
                    is_admin: document.getElementById('newStaffAdmin').value === 'true',
                    photo_url,
                };
                const machine = document.getElementById('newStaffMachine').value;
                try {
                    const created = await DB.addStaff(rec);
                    let noteHtml = '';
                    // If a machine was picked (only meaningful for MO/PO, and only
                    // possible once a home team is set), place them straight into
                    // that slot — same as picking it from Staff Directory afterward,
                    // just done in one step here.
                    if (machine && (rec.role_code === 'MO' || rec.role_code === 'PO')){
                        if (!rec.home_team){
                            noteHtml = ' Machine not assigned &mdash; pick a home team too, then set it from Staff Directory.';
                        } else {
                            const roleSuffix = rec.role_code === 'PO' ? 'po' : 'mo';
                            await DB.setAssignment(rec.home_team, machine.toLowerCase() + roleSuffix, created.id, false);
                        }
                    }
                    msg.innerHTML = `<div class="app-msg ok">Staff member added.${noteHtml}</div>`;
                    await this.renderStaffDirectory();
                    await this.renderAssignments(this.activeTeamTab);
                    await renderBoard();
                } catch (e){
                    // Most common cause: that email is already used by another
                    // staff member (email must be unique) — Supabase reports
                    // that as an error here rather than silently failing.
                    msg.innerHTML = `<div class="app-msg error">Could not add staff member: ${e.message || e}</div>`;
                }
            },
            async renderLeaveAdmin(){
                const leaveList = await DB.getLeave();
                const staffList = await DB.getStaff();

                const staffSelect = document.getElementById('adminLeaveStaff');
                staffSelect.innerHTML = staffList.map(s=>`<option value="${s.id}">${s.full_name}</option>`).join('');

                const today = eatDateString();
                const rows = leaveList.map(l=>{
                    const staff = staffList.find(s=>s.id===l.staff_id) || l.staff;
                    // Once an approved leave's end date has passed, it's history —
                    // there's nothing left to revoke and nobody left to cover, so
                    // showing those as live actions just invites confusion (or a
                    // leader accidentally re-triggering a replacement for dates
                    // that already happened).
                    const isPast = l.end_date && l.end_date < today;
                    const isCompleted = l.status === 'approved' && isPast;

                    let statusDisplay = l.status;
                    let actions = '';
                    if (isCompleted){
                        statusDisplay = 'completed';
                    } else if (l.status === 'pending'){
                        actions = `<button class="app-btn" style="padding:5px 10px;font-size:12px;background:var(--ok);" onclick="AdminView.setLeaveStatus('${l.id}','approved')">Approve</button>
                            <button class="app-btn" style="padding:5px 10px;font-size:12px;background:var(--danger);margin-left:4px;" onclick="AdminView.setLeaveStatus('${l.id}','rejected')">Reject</button>`;
                    } else if (l.status === 'approved'){
                        actions = `<button class="app-btn secondary" style="padding:5px 10px;font-size:12px;" onclick="AdminView.setLeaveStatus('${l.id}','rejected')">Revoke</button>`;
                    } else {
                        actions = `<button class="app-btn secondary" style="padding:5px 10px;font-size:12px;" onclick="AdminView.setLeaveStatus('${l.id}','approved')">Re-approve</button>`;
                    }
                    // Find replacement stays available on anything still live
                    // (pending, currently-approved, or rejected-and-reconsiderable)
                    // — just not on a record that's already run its course.
                    if (!isCompleted){
                        actions += `<button class="app-btn secondary" style="padding:5px 10px;font-size:12px;margin-left:4px;" onclick="AdminView.showReplacementSuggestion('${l.id}','${l.staff_id}')">Find replacement</button>`;
                    }
                    const row = `<tr${isCompleted ? ' style="color:#999;"' : ''}><td>${staff?staff.full_name:''}</td><td>${l.leave_type}</td><td>${l.start_date}</td><td>${l.end_date||''}</td><td>${statusDisplay}</td><td>${l.note||''}</td><td>${actions}</td></tr>`;
                    const suggestionRow = isCompleted ? '' : `<tr><td colspan="7" style="border-top:none;padding-top:0;"><div id="replacementSuggestion_${l.id}"></div></td></tr>`;
                    return row + suggestionRow;
                }).join('');
                document.getElementById('leaveAdminBody').innerHTML = `<h3 style="margin-bottom:10px;">&#128203; Leave records</h3><table class="app-table">
                    <thead><tr><th>Staff</th><th>Type</th><th>Start</th><th>End</th><th>Status</th><th>Note</th><th></th></tr></thead>
                    <tbody>${rows}</tbody></table>`;
                if (document.getElementById('adminStatCards')) await this.renderStatCards();
            },
            async addLeaveRecord(){
                const msg = document.getElementById('addLeaveMsg');
                const staffId = document.getElementById('adminLeaveStaff').value;
                const start = document.getElementById('adminLeaveStart').value;
                if (!staffId){ msg.innerHTML = '<div class="app-msg error">Add a staff member first (Staff Directory tab).</div>'; return; }
                if (!start){ msg.innerHTML = '<div class="app-msg error">Pick a start date.</div>'; return; }
                const rec = {
                    staff_id: staffId,
                    leave_type: document.getElementById('adminLeaveType').value,
                    status: document.getElementById('adminLeaveStatus').value,
                    start_date: start,
                    end_date: document.getElementById('adminLeaveEnd').value || null,
                    note: document.getElementById('adminLeaveNote').value,
                };
                try {
                    const created = await DB.addLeave(rec);
                    msg.innerHTML = '<div class="app-msg ok">Leave record added.</div>';
                    document.getElementById('adminLeaveNote').value = '';
                    await this.renderLeaveAdmin();
                    await renderBoard();
                    // Creating the record already Approved (skipping the separate
                    // Approve step) still needs the same fair-replacement offer —
                    // it shouldn't only appear when going through Approve.
                    if (rec.status === 'approved' && created) await this.showReplacementSuggestion(created.id, staffId);
                } catch (e){
                    msg.innerHTML = `<div class="app-msg error">${e.message || e}</div>`;
                }
            },
            async setLeaveStatus(id, status){
                try {
                    await DB.updateLeaveStatus(id, status);
                    await this.renderLeaveAdmin();
                    await renderBoard();
                    if (status === 'approved'){
                        const leaveList = await DB.getLeave();
                        const rec = leaveList.find(l=>l.id===id);
                        if (rec) await this.showReplacementSuggestion(id, rec.staff_id);
                    }
                } catch (e){
                    alert('Could not update: ' + (e.message || e));
                }
            },
            async showReplacementSuggestion(leaveId, staffId){
                const box = document.getElementById('replacementSuggestion_'+leaveId);
                if (!box) return;
                box.innerHTML = '<span style="font-size:12.5px;color:#777;">Finding a fair replacement&hellip;</span>';
                const slot = await findStaffCurrentSlot(staffId);
                if (!slot){
                    box.innerHTML = `<p style="font-size:12.5px;color:#777;margin:4px 0;">This person isn't currently placed in any slot, so there's nothing on the board to cover.</p>`;
                    return;
                }
                const sourceTeam = REPLACEMENT_SOURCE_TEAM[slot.team];
                const staffList = await DB.getStaff();
                const candidates = staffList.filter(s => s.home_team === sourceTeam && s.role_code === slot.roleCode && s.id !== staffId);
                if (!candidates.length){
                    box.innerHTML = `<p style="font-size:12.5px;color:#a86b6b;margin:4px 0;">No ${slot.roleCode} available on Team ${sourceTeam} (the fair pick for Team ${slot.team}'s ${slot.label}) to cover this. Assign someone manually from Staff Directory or Assignments if needed.</p>`;
                    return;
                }
                const options = candidates.map(s=>`<option value="${s.id}">${s.full_name}</option>`).join('');
                box.innerHTML = `<div style="font-size:12.5px;color:#444;margin:4px 0;padding:6px;background:#f4f4f4;border-radius:4px;">
                    <b>Suggested cover for ${slot.label} (Team ${slot.team}):</b> Team ${sourceTeam} &mdash; not paired with them today, not next up either.
                    <select id="replPick_${leaveId}" style="margin-left:6px;">${options}</select>
                    <button class="app-btn" style="padding:4px 10px;font-size:12px;margin-left:6px;" onclick="AdminView.placeReplacement('${leaveId}','${slot.team}','${slot.slotId}','${staffId}')">Place in ${slot.label}</button>
                </div>`;
            },
            async placeReplacement(leaveId, team, slotId, originalStaffId){
                const sel = document.getElementById('replPick_'+leaveId);
                const staffId = sel ? sel.value : null;
                if (!staffId) return;
                try {
                    await DB.setAssignment(team, slotId, staffId, false);
                    // Remember who's covering and exactly where, so this can be
                    // undone automatically the moment the leave ends — see
                    // reconcileExpiredReplacements(), which runs on every board
                    // load/refresh.
                    await DB.setLeaveReplacement(leaveId, staffId, team, slotId);
                    document.getElementById('replacementSuggestion_'+leaveId).innerHTML =
                        `<div class="app-msg ok" style="margin:4px 0;">Placed &mdash; they'll show on the board in their own team's colour, marked as on loan. They'll automatically be swapped back out and the original person restored once this leave ends.</div>`;
                    await renderBoard();
                } catch (e){
                    alert('Could not place replacement: ' + (e.message || e));
                }
            },
            async saveRotation(){
                const val = document.getElementById('cycleStartInput').value;
                if (!val) return;
                try {
                    await DB.saveRotationStart(val);
                    document.getElementById('rotationMsg').innerHTML = '<div class="app-msg ok">Rotation start date saved.</div>';
                    await renderBoard();
                } catch (e){
                    document.getElementById('rotationMsg').innerHTML = `<div class="app-msg error">Could not save: ${e.message || e}</div>`;
                }
            }
        };

        /* ============================================================
           INIT
           ============================================================ */
        window.addEventListener('error', (e)=>{
            console.error('Uncaught error:', e.error || e.message);
        });
        window.addEventListener('unhandledrejection', (e)=>{
            console.error('Unhandled promise rejection:', e.reason);
        });

        window.addEventListener('load', async ()=>{
            renderNav();
            tickClock();
            setInterval(tickClock, 1000);
            await renderBoard();
            setInterval(renderBoard, 60000);
            if (rotationEnabled) startRotationTimer();

            if (sb){
                try {
                    const { data: { session: s } } = await withTimeout(sb.auth.getSession(), 8000);
                    if (s){ await loadStaffProfile(s.user); afterLogin(false); }
                    sb.auth.onAuthStateChange(async (event, s)=>{
                        if (event === 'SIGNED_IN' && s){ await loadStaffProfile(s.user); afterLogin(false); }
                        if (event === 'SIGNED_OUT'){ session = { user:null, staff:null }; renderNav(); }
                    });
                } catch (e){
                    console.error('Auth session check failed:', e);
                }
            }
        });

    </script>

</body>
</html>
